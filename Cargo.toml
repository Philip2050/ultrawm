[package]
name = "ultrawm"
version = "8.3.0"
edition = "2021"
authors = ["Blake"]
license = "MIT"
description = "An ultimate tiling window manager for Windows: hyprscroll2d 2D lattice + Niri layout + Hyprland polish + Omarchy theming"
repository = "https://github.com/blake/ultrawm"

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
strip = true
opt-level = 3
panic = "abort"

[dependencies]
# Win32 interop
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_Touch",
    "Win32_Media_Audio",
] }

# Utilities
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

# Graphics for overlay rendering
tiny-skia = "0.11"
png = "0.17"
winreg = "0.55"
dirs = "6.0"
chrono = "0.4"
